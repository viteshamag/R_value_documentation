solver:                                                                                                                 
  mechanical: spectral_basic

loadstep:                                                                                                               
  - boundary_conditions:                                                                                                
      mechanical:                                                                                                       
        L:     [[1.0e-3, 0, 0],                                                                                         
                [0,      x, 0],                                                                                         
                [0,      0, x]]                                                                                         
        P: [[x, x, x],                                                                                                  
            [x, 0, x],                                                                                                  
            [x, x, 0]]                                                                                                  
    discretization:                                                                                                     
      t: 2.3                                                                                                            
      N: 100                                                                                                            
    f_out: 10   
  - boundary_conditions:                                                                                                
      mechanical:                                                                                                       
        L:     [[1.0e-3, 0, 0],                                                                                         
                [0,      x, 0],                                                                                         
                [0,      0, x]]                                                                                         
        P: [[x, x, x],                                                                                                  
            [x, 0, x],                                                                                                  
            [x, x, 0]]                                                                                                  
    discretization:                                                                                                     
      t: 100.0                                                                                                          
      N: 3000                                                                                                           
    f_out: 100   